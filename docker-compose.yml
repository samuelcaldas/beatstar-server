services:
  beatstar-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beatstar-private-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/beatstar.db
      - GATEWAY_PUBLIC_HOST=beatstar.dev.timoteo.mg.gov.br
      - GATEWAY_PUBLIC_PORT=8080
      - ASSETS_BASE_URL=http://beatstar.dev.timoteo.mg.gov.br:8080/assets
    volumes:
      - ./data:/app/data
      - ./server:/app/server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
